<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CORE Compliance Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: regulator's console — dark-green header band with view tabs, summary-first overview, dense operable tables, side drawer for entity files */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e9ede8; --line:#d5ddd5; --line-strong:#b8c4b9;
  --fg:#16211b; --muted:#5a6a60; --faint:#8a988f;
  --band:#0e3b29; --band-fg:#eaf3ec; --band-muted:#9fbcab; --accent:#0d7a4a; --accent-soft:#dcefe3;
  --ok:#1f8a4c; --ok-soft:#ddf1e4;
  --due:#b7791f; --due-soft:#f8ecd3;
  --over:#d0581c; --over-soft:#fbe3d6;
  --non:#c0262d; --non-soft:#f8dcdd;
  --shadow:0 1px 2px rgba(14,59,41,.06),0 4px 16px rgba(14,59,41,.06);
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1511; --surface:#131e18; --sunk:#0f1914; --line:#22332a; --line-strong:#33493c;
  --fg:#e3ece6; --muted:#9db0a4; --faint:#6c8075;
  --band:#0a2a1d; --band-fg:#e3efe7; --band-muted:#86a796; --accent:#3fbf80; --accent-soft:#163626;
  --ok:#47b878; --ok-soft:#163423; --due:#e0a542; --due-soft:#3a2d12; --over:#f0814a; --over-soft:#3d2215; --non:#f0646a; --non-soft:#3e1a1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1511; --surface:#131e18; --sunk:#0f1914; --line:#22332a; --line-strong:#33493c;
  --fg:#e3ece6; --muted:#9db0a4; --faint:#6c8075;
  --band:#0a2a1d; --band-fg:#e3efe7; --band-muted:#86a796; --accent:#3fbf80; --accent-soft:#163626;
  --ok:#47b878; --ok-soft:#163423; --due:#e0a542; --due-soft:#3a2d12; --over:#f0814a; --over-soft:#3d2215; --non:#f0646a; --non-soft:#3e1a1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto}

/* header */
header.top{background:var(--band);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-row{display:flex;align-items:center;gap:16px;padding-block:14px 10px;flex-wrap:wrap}
.brand{color:inherit;text-decoration:none;display:flex;align-items:baseline;gap:12px;min-width:0}
.brand b{font-size:22px;font-weight:800;letter-spacing:.12em}
.brand span{color:var(--band-muted);font-size:13px}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip-proto{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--band-muted);color:var(--band-muted);padding:3px 8px;border-radius:999px}
.officer{font-size:12px;color:var(--band-muted)}
.officer select{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--band-fg);border-radius:6px;padding:3px 6px;font-size:12px}
.officer select option{color:#16211b;background:#fff}
.bell{position:relative;background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--band-fg);border-radius:8px;padding:5px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
.bell .dot{background:var(--non);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{color:var(--band-muted);text-decoration:none;padding:10px 14px;font-weight:600;font-size:13px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--band-fg)}
nav.tabs a[aria-current="page"]{color:var(--band-fg);border-bottom-color:var(--accent)}
nav.tabs .ct{font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 7px;margin-left:6px}

main{padding-block:20px 48px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:20px;margin:0;font-weight:700;text-wrap:balance}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.asof{font-size:12px;color:var(--muted)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 0}
.panel-h h2{font-size:13px;margin:0;font-weight:700;letter-spacing:.02em}
.panel-h .sub{font-size:12px;color:var(--muted)}
.panel-b{padding:12px 16px 16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
.ov{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);margin-top:14px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.ov{grid-template-columns:1fr}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.kpi{padding:14px 16px;border-top:3px solid var(--line-strong)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-size:30px;font-weight:800;margin-top:4px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.ok{border-top-color:var(--ok)} .kpi.due{border-top-color:var(--due)} .kpi.enf{border-top-color:var(--non)} .kpi.pen{border-top-color:var(--accent)}
.kpi.pen .v{font-size:24px;padding-top:5px}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px 2px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}
.s-compliant{color:var(--ok);background:var(--ok-soft)}
.s-due{color:var(--due);background:var(--due-soft)}
.s-due::before{border-radius:50%}
.s-overdue{color:var(--over);background:var(--over-soft)}
.s-overdue::before{transform:rotate(45deg)}
.s-non{color:var(--non);background:var(--non-soft)}
.s-non::before{border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border:1px solid var(--line-strong);border-radius:4px;color:var(--muted);white-space:nowrap}

/* stacked status bar */
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk);gap:2px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend b{color:var(--fg);font-variant-numeric:tabular-nums;margin-left:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.rows{display:grid;gap:8px;margin-top:4px}
.brow{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12px}
.brow .n{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .r{text-align:right;color:var(--muted);font-family:var(--f-mono)}
.brow .stack{height:12px}

/* timeline strip */
.strip{position:relative;height:92px;margin:8px 4px 0}
.strip .axis{position:absolute;left:0;right:0;top:56px;height:1px;background:var(--line-strong)}
.strip .tick{position:absolute;top:56px;font-size:10px;color:var(--faint);transform:translateX(-50%);padding-top:8px;font-family:var(--f-mono)}
.strip .tick::before{content:"";position:absolute;left:50%;top:-3px;width:1px;height:7px;background:var(--line-strong)}
.strip .today{position:absolute;top:0;bottom:30px;width:2px;background:var(--fg);opacity:.75}
.strip .today span{position:absolute;top:-2px;left:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.strip .mk{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface);cursor:pointer;padding:0}
.strip .mk:hover{transform:translate(-50%,-50%) scale(1.35)}

/* queue cards (overview) */
.qlist{display:grid;gap:0}
.qi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.qi:first-child{border-top:0}
.qi:hover .nm{color:var(--accent)}
.qi .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.risk{display:inline-flex;align-items:center;gap:8px}
.risk .bar{width:56px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.risk .bar i{display:block;height:100%}
.risk b{font-family:var(--f-mono);font-size:13px;min-width:22px;text-align:right}

/* toolbar + table */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;font-size:13px;min-width:0}
.toolbar input[type=search]{flex:1 1 220px}
.btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{border-color:var(--non);color:var(--non)}
.btn.sm{padding:4px 9px;font-size:12px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:var(--surface);position:sticky;top:0}
th button{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
th button:hover{color:var(--fg)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
td .nm{font-weight:600}
td .sub{font-size:12px;color:var(--muted)}
.days{font-family:var(--f-mono);font-size:12px}
.days.neg{color:var(--non);font-weight:600}
.empty{padding:32px;text-align:center;color:var(--muted)}

/* enforcement queue */
.qrow{display:grid;grid-template-columns:44px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.3fr) auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.rank{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.gauge{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;position:relative}
.gauge::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.gauge span{position:relative;z-index:1}
.rec{font-size:12px}
.rec b{display:block;font-size:13px}
.qacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:900px){.qrow{grid-template-columns:44px minmax(0,1fr)}.qrow>.c3,.qrow>.c4,.qrow>.qacts{grid-column:2}.qacts{justify-content:flex-start}}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* audit */
.audit li{display:grid;grid-template-columns:150px 140px minmax(0,1fr);gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:13px}
.audit li:first-child{border-top:0}
.audit ol{list-style:none;margin:0;padding:0}
.audit .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.audit .who{font-size:12px;color:var(--muted)}
.audit .what b{font-weight:600}
.audit .what a{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer}
@media (max-width:700px){.audit li{grid-template-columns:1fr;gap:2px}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,20,12,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{padding:18px 20px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.dh-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:19px;text-wrap:balance}
.x{background:none;border:1px solid var(--line-strong);border-radius:8px;width:32px;height:32px;font-size:18px;line-height:1;flex:none}
.db{overflow-y:auto;padding:16px 20px 32px;display:grid;gap:14px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;font-size:13px}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0}
.rb{display:grid;gap:6px;font-size:12px}
.rb div{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:8px;align-items:center}
.rb .bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.rb .bar i{display:block;height:100%;background:var(--fg);opacity:.7}
.rb b{font-family:var(--f-mono);text-align:right}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:0 0 14px 22px;font-size:13px}
.tl li::before{content:"";position:absolute;left:5px;top:6px;bottom:-6px;width:1px;background:var(--line-strong)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:0;top:4px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--tc,var(--line-strong))}
.tl .when{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tl .note{color:var(--muted);font-size:12px}
.act-form{display:grid;gap:8px}
.act-form .row{display:flex;gap:8px;flex-wrap:wrap}
.act-form select,.act-form textarea,.fld input,.fld select{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:13px;width:100%}
.act-form textarea{min-height:60px;resize:vertical}
.callout{border-left:3px solid var(--tc,var(--accent));background:var(--surface);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px}
.callout b{display:block}

/* modal form */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:42;padding:16px}
.modal .card{background:var(--surface);border-radius:12px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal .card h2{margin:0;font-size:17px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.fld.full{grid-column:1/-1}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}

/* alerts popover */
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,calc(100vw - 32px));background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:25;max-height:60vh;overflow:auto}
.pop h3{margin:0;padding:12px 14px;font-size:13px;border-bottom:1px solid var(--line)}
.pop button.al{display:grid;gap:2px;text-align:left;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;font-size:12px}
.pop button.al:hover{background:var(--sunk)}
.pop .al b{font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.foot{margin-top:28px;font-size:12px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:0;font-size:12px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap gut">
    <div class="top-row">
      <a class="brand" href="../" target="_top" title="Back to the CORE home page"><b>CORE</b><span>Compliance Oversight &amp; Regulatory Enforcement</span></a>
      <div class="top-meta">
        <a class="chip-proto" id="homeLink" href="../" target="_top" style="text-decoration:none">← CORE home</a>
        <span class="chip-proto">Prototype · mock data</span>
        <label class="officer">Officer
          <select id="officer">
            <option>A. Mahmud (Enforcement)</option>
            <option>Y. Kabiru (Compliance)</option>
            <option>F. Okafor (Audit)</option>
            <option>T. Adeyemi (Legal)</option>
          </select>
        </label>
        <div style="position:relative">
          <button class="bell" id="bellBtn" aria-expanded="false" aria-haspopup="true">Alerts <span class="dot" id="bellCt">0</span></button>
          <div class="pop" id="pop" hidden></div>
        </div>
      </div>
    </div>
    <nav class="tabs" aria-label="Views">
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#registry" data-view="registry">Entity registry <span class="ct" id="ctReg"></span></a>
      <a href="#enforcement" data-view="enforcement">Enforcement queue <span class="ct" id="ctEnf"></span></a>
      <a href="#audit" data-view="audit">Audit trail <span class="ct" id="ctAud"></span></a>
    </nav>
  </div>
</header>

<main class="wrap gut" id="main"></main>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- utilities ---------- */
const DAY=864e5;
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const addDays=(d,n)=>new Date(d.getTime()+n*DAY);
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const fmtD=d=>new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const fmtDT=d=>new Date(d).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const daysBetween=(a,b)=>Math.round((new Date(b).setHours(0,0,0,0)-new Date(a).setHours(0,0,0,0))/DAY);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function buildSeed(){
  const r=rng(2026);
  return SEED.map((s,i)=>{
    const [name,sector,state,obl,tier,off,prior,rev]=s;
    const deadline=addDays(TODAY,off);
    const regDate=addDays(deadline,-(365*(1+Math.floor(r()*4)))-Math.floor(r()*40));
    const notices=off<-30?(off<-60?2:1):0;
    const e={id:"NITDA-"+(1001+i),name,sector,state,zone:ZONES[state],obligation:obl,tier,deadline:iso(deadline),regDate:iso(regDate),
      lastFiled:iso(addDays(deadline,-365)),prior,revenue:rev*1e9,notices,dpo:r()>.18,history:[]};
    // history: registration, last filing, and any past notices
    e.history.push({t:addDays(new Date(e.regDate),0).getTime(),kind:"system",text:"Entity registered with NITDA"});
    e.history.push({t:new Date(e.lastFiled).getTime()+9*36e5,kind:"filed",text:OBLIG[obl].label+" filing received for previous cycle",by:"System"});
    if(off<0)e.history.push({t:new Date(e.deadline).getTime()+DAY+7*36e5,kind:"system",text:"Auto-flagged overdue: deadline passed with no filing",by:"CORE flagging engine"});
    if(notices>=1)e.history.push({t:addDays(new Date(e.deadline),21).getTime()+10*36e5,kind:"notice",text:"Compliance notice issued (14-day response window)",by:"Y. Kabiru (Compliance)"});
    if(notices>=2)e.history.push({t:addDays(new Date(e.deadline),48).getTime()+11*36e5,kind:"notice",text:"Second compliance notice issued — no response to first",by:"A. Mahmud (Enforcement)"});
    if(off>0&&off<=14)e.history.push({t:addDays(new Date(e.deadline),-14).getTime()+8*36e5,kind:"reminder",text:"Automated 14-day deadline reminder sent to DPO",by:"CORE flagging engine"});
    return e;
  });
}

function derive(e){
  const days=daysBetween(TODAY,e.deadline);
  let status=days>14?"compliant":days>=0?"due":days>=-30?"overdue":"non";
  if(days<0&&e.notices>=2)status="non";
  const over=Math.max(0,-days);
  const parts=[
    ["Days past deadline",Math.min(40,Math.round(over*0.6)),40],
    ["Data-subject tier ("+e.tier+")",TIERS[e.tier].w,20],
    ["Sector sensitivity",SECTORS[e.sector]||5,12],
    ["Prior violations",Math.min(12,e.prior*6),12],
    ["Unanswered notices",Math.min(10,e.notices*5),10],
    ["No DPO on record",e.dpo?0:6,6]
  ];
  let risk=parts.reduce((a,p)=>a+p[1],0);
  if(days>=0) risk=Math.round(risk*(days<=14?0.55:0.3));
  risk=Math.max(1,Math.min(100,risk));
  const major=TIERS[e.tier].major;
  const penalty=e.revenue>0?Math.max(major?10e6:2e6,0.02*e.revenue):(major?10e6:2e6);
  let rec;
  if(status==="non"&&risk>=75)rec={k:"sanction",why:"Deadline missed by "+over+" days"+(e.notices?" and "+e.notices+" notice"+(e.notices>1?"s":"")+" unanswered":"")+"."};
  else if(status==="non"||(status==="overdue"&&risk>=55))rec={k:e.notices?"audit":"notice",why:e.notices?"Notice already issued; verify processing on site.":"Formal notice starts the 14-day response window."};
  else if(status==="overdue")rec={k:"notice",why:"Overdue by "+over+" days with no filing."};
  else if(status==="due")rec={k:"reminder",why:"Deadline in "+days+" day"+(days===1?"":"s")+"."};
  else rec={k:"note",why:"No action needed this cycle."};
  return {days,status,risk,parts,penalty,rec,over};
}
const view=()=>S.entities.map(e=>Object.assign({},e,{d:derive(e)}));

/* ---------- logging ---------- */
const officer=()=>document.getElementById("officer").value;
function logAction(e,kind,note){
  const now=Date.now();
  const by=officer();
  let text=ACTIONS[kind].label;
  if(kind==="notice"){e.notices=(e.notices||0)+1;text="Compliance notice issued (14-day response window)"}
  if(kind==="reminder")text="Deadline reminder sent to DPO";
  if(kind==="audit")text="Compliance audit scheduled for "+fmtD(addDays(TODAY,10));
  if(kind==="sanction")text="Referred to Legal for sanction under NDPA 2023, s.48";
  if(kind==="filed"){const o=OBLIG[e.obligation];text=o.label+" filing received — next deadline "+fmtD(addDays(TODAY,o.cycle));e.lastFiled=iso(TODAY);e.deadline=iso(addDays(TODAY,o.cycle));e.notices=0}
  if(kind==="note")text="Case note";
  e.history.push({t:now,kind,text,by,note:note||""});
  S.audit.unshift({t:now,id:e.id,name:e.name,kind,text,by,note:note||""});
  save();
  toast(ACTIONS[kind].label+" logged for "+e.name);
  render();
}

function overview(V,enf){

    return Object.entries(g).sort((a,b)=>((b[1].overdue+b[1].non)/b[1].n)-((a[1].overdue+a[1].non)/a[1].n)||b[1].n-a[1].n)};

  return`
  <div class="page-head"><div><h1>Agency-wide compliance status</h1><p>Every entity under NITDA oversight, flagged automatically against its next deadline.</p></div><span class="asof">Status as of <b>${fmtD(TODAY)}</b></span></div>

      <div class="gauge" style="background:conic-gradient(${riskColor(e.d.risk)} ${e.d.risk*3.6}deg,var(--sunk) 0)"><span>${e.d.risk}</span></div>
      <div style="min-width:0"><button class="linkbtn" style="font-size:14px;color:var(--fg);text-align:left" data-open="${e.id}">${esc(e.name)}</button>
        <div class="sub" style="font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px"><span class="rank">#${i+1}</span><span class="mono">${e.id}</span><span class="tag">${e.obligation}</span>${esc(e.sector)} · ${e.tier}</div></div>
      <div class="c3">${pill(e.d.status)}<div style="margin-top:4px">${daysTxt(e.d.days)}${e.notices?` <span class="sub" style="font-size:12px;color:var(--muted)">· ${e.notices} notice${e.notices>1?"s":""}</span>`:""}</div></div>
      <div class="c4 rec"><span style="color:var(--muted)">Recommended</span><b>${ACTIONS[r.k].label}</b><span style="color:var(--muted)">${esc(r.why)}</span></div>
      <div class="qacts"><button class="btn sm primary" data-act="${r.k}" data-id="${e.id}">${ACTIONS[r.k].label}</button><button class="btn sm" data-act="filed" data-id="${e.id}">Filing received</button><button class="btn sm" data-open="${e.id}">Open file</button></div>
    </div>`}).join("")||`<div class="empty">The queue is clear. No entity is overdue.</div>`}</div>`;
}

function audit(){
  return`<div class="page-head"><div><h1>Audit trail</h1><p>Timestamped record of every enforcement action taken in CORE, newest first.</p></div></div>
  <div class="panel audit">${S.audit.length?`<ol>${S.audit.map(a=>`<li><span class="when">${fmtDT(a.t)}</span><span class="who">${esc(a.by)}</span><span class="what"><b>${esc(a.text)}</b> — <a data-open="${a.id}">${esc(a.name)}</a> <span class="mono" style="color:var(--faint);font-size:11px">${a.id}</span>${a.note?`<div style="color:var(--muted);font-size:12px;margin-top:2px">“${esc(a.note)}”</div>`:""}</span></li>`).join("")}</ol>`:
  `<div class="empty"><b style="display:block;color:var(--fg);margin-bottom:4px">No actions logged yet</b>Take an action from the enforcement queue or an entity's file and it will appear here with your name and the time.<div style="margin-top:12px"><a class="btn" href="#enforcement">Go to enforcement queue</a></div></div>`}</div>`;
}

/* ---------- drawer ---------- */
let openId=null;
function drawer(id){
  openId=id;
  const e0=S.entities.find(x=>x.id===id);if(!e0){closeLayer();return}
  const e=Object.assign({},e0,{d:derive(e0)});const d=e.d;
  const hist=[...e.history].sort((a,b)=>b.t-a.t);
  const sc=STATUS[d.status].c;
  $("#layer").innerHTML=`<div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(e.name)}">
    <div class="dh"><div class="dh-top"><div style="min-width:0"><div class="mono" style="font-size:12px;color:var(--muted)">${e.id}</div><h2>${esc(e.name)}</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center">${pill(d.status)}<span class="tag">${e.obligation}</span>${riskEl(d.risk)}</div></div>
      <button class="x" data-close aria-label="Close">×</button></div></div>
    <div class="db">
      <div class="callout" style="--tc:${ACTIONS[d.rec.k].tc}"><b>Recommended: ${ACTIONS[d.rec.k].label}</b>${esc(d.rec.why)}</div>
      <div class="panel"><div class="panel-b"><dl class="facts" style="margin:0">
        <div><dt>Obligation</dt><dd>${OBLIG[e.obligation].full}</dd></div>
        <div><dt>Next deadline</dt><dd>${fmtD(e.deadline)} · ${daysTxt(d.days)}</dd></div>
        <div><dt>Sector</dt><dd>${esc(e.sector)}</dd></div>
        <div><dt>Location</dt><dd>${esc(e.state)}, ${esc(e.zone)}</dd></div>
        <div><dt>Data-subject tier</dt><dd>${e.tier} · ${TIERS[e.tier].label}</dd></div>
        <div><dt>DPO on record</dt><dd>${e.dpo?"Yes":"No"}</dd></div>
        <div><dt>Registered</dt><dd>${fmtD(e.regDate)}</dd></div>
        <div><dt>Last filing</dt><dd>${fmtD(e.lastFiled)}</dd></div>
        <div><dt>Annual revenue</dt><dd>${e.revenue?naira(e.revenue):"Not applicable (MDA)"}</dd></div>
        <div><dt>Penalty exposure</dt><dd>${naira(d.penalty)} <span style="color:var(--muted);font-size:12px">indicative</span></dd></div>
      </dl></div></div>
      <div class="panel"><div class="panel-h"><h2>Risk score breakdown</h2><span class="sub">${d.days>=0?"scaled down: not yet overdue":"sum of factors"}</span></div>
        <div class="panel-b rb">${d.parts.map(p=>`<div><span>${esc(p[0])}</span><span class="bar"><i style="width:${p[1]/p[2]*100}%"></i></span><b>${p[1]}</b></div>`).join("")}</div></div>
      <div class="panel"><div class="panel-h"><h2>Log an action</h2><span class="sub">as ${esc(officer())}</span></div>
        <div class="panel-b"><form class="act-form" id="actForm">
          <select id="actKind" aria-label="Action">${Object.entries(ACTIONS).map(([k,a])=>`<option value="${k}"${k===d.rec.k?" selected":""}>${a.label}</option>`).join("")}</select>
          <textarea id="actNote" placeholder="Note for the record (optional)" aria-label="Note"></textarea>
          <div class="row"><button class="btn primary" type="submit">Log action</button></div>
        </form></div></div>
      <div class="panel"><div class="panel-h"><h2>Compliance timeline</h2><span class="sub">${hist.length} events</span></div>
        <div class="panel-b"><ol class="tl">
          <li style="--tc:${sc}"><div><b>${d.days<0?"Deadline missed":"Next deadline"}</b> — ${fmtD(e.deadline)}</div><div class="when">${d.days<0?(-d.days)+" days ago":"in "+d.days+" days"}</div></li>
          ${hist.map(h=>`<li style="--tc:${(ACTIONS[h.kind]||{}).tc||"var(--line-strong)"}"><div>${esc(h.text)}</div><div class="when">${fmtDT(h.t)}${h.by?" · "+esc(h.by):""}</div>${h.note?`<div class="note">“${esc(h.note)}”</div>`:""}</li>`).join("")}
        </ol></div></div>
    </div>
  </aside>`;
  $("#actForm").addEventListener("submit",ev=>{ev.preventDefault();logAction(e0,$("#actKind").value,$("#actNote").value.trim())});
}
function closeLayer(){openId=null;$("#layer").innerHTML=""}

/* ---------- add entity ---------- */
function addForm(){
  openId=null;
  const opt=a=>a.map(x=>`<option>${esc(x)}</option>`).join("");
  $("#layer").innerHTML=`<div class="scrim" data-close></div><div class="modal"><form class="card" id="addF" style="padding:20px;display:grid;gap:14px" role="dialog" aria-modal="true" aria-label="Register entity">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>Register entity</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>
    <div class="fgrid">
      <label class="fld full">Entity name<input id="nName" required placeholder="e.g. Kwara Digital Pharmacy Ltd"></label>
      <label class="fld">Sector<select id="nSector">${opt(Object.keys(SECTORS))}</select></label>
      <label class="fld">State<select id="nState">${opt(Object.keys(ZONES))}</select></label>
      <label class="fld">Obligation<select id="nObl">${Object.keys(OBLIG).map(k=>`<option value="${k}">${k}</option>`).join("")}</select></label>
      <label class="fld">Data-subject tier<select id="nTier">${Object.keys(TIERS).map(k=>`<option value="${k}">${k} · ${TIERS[k].label}</option>`).join("")}</select></label>
      <label class="fld">Last filing date<input type="date" id="nFiled" value="${iso(addDays(TODAY,-200))}" required></label>
      <label class="fld">Annual revenue (₦bn)<input type="number" id="nRev" min="0" step="0.1" value="2"></label>
    </div>
    <p style="margin:0;font-size:12px;color:var(--muted)">CORE sets the next deadline to 12 months after the last filing and flags the entity automatically.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Register</button></div>
  </form></div>`;
  $("#nName").focus();
  $("#addF").addEventListener("submit",ev=>{ev.preventDefault();
    const n=Math.max(...S.entities.map(e=>+e.id.split("-")[1]))+1;
    const filed=$("#nFiled").value, obl=$("#nObl").value, st=$("#nState").value;
    const e={id:"NITDA-"+n,name:$("#nName").value.trim(),sector:$("#nSector").value,state:st,zone:ZONES[st],obligation:obl,tier:$("#nTier").value,
      regDate:iso(TODAY),lastFiled:filed,deadline:iso(addDays(new Date(filed),OBLIG[obl].cycle)),prior:0,revenue:(+$("#nRev").value||0)*1e9,notices:0,dpo:true,
      history:[{t:Date.now(),kind:"system",text:"Entity registered with NITDA",by:officer()}]};
    S.entities.push(e);
    S.audit.unshift({t:Date.now(),id:e.id,name:e.name,kind:"note",text:"Entity registered",by:officer(),note:""});
    save();closeLayer();toast(e.name+" registered as "+e.id);render();drawer(e.id);
  });
}

/* ---------- alerts ---------- */
function renderAlerts(V){
  const al=V.filter(e=>e.d.status!=="compliant").sort((a,b)=>b.d.risk-a.d.risk).map(e=>({id:e.id,key:e.id+":"+e.d.status+":"+e.deadline,e}));
  const unseen=al.filter(a=>!S.seenAlerts.includes(a.key));
  $("#bellCt").textContent=unseen.length;$("#bellCt").hidden=!unseen.length;
  $("#pop").innerHTML=`<h3>Escalation alerts · ${al.length}</h3>${al.slice(0,12).map(a=>`<button class="al" data-open="${a.id}"><b>${esc(a.e.name)}</b><span>${pill(a.e.d.status)} ${a.e.d.days<0?(-a.e.d.days)+" days past "+a.e.obligation+" deadline":a.e.obligation+" due in "+a.e.d.days+" days"} · risk ${a.e.d.risk}</span></button>`).join("")}`;
  renderAlerts.keys=al.map(a=>a.key);
}

/* ---------- toast ---------- */
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

/* ---------- events ---------- */
function route(){const h=(location.hash||"").slice(1);current=["overview","registry","enforcement","audit"].includes(h)?h:"overview";closeLayer();render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-open],[data-close],[data-sort],[data-act],[data-scope],[data-add],[data-reset],#bellBtn");
  if(!ev.target.closest(".pop")&&!ev.target.closest("#bellBtn")&&!$("#pop").hidden){$("#pop").hidden=true;$("#bellBtn").setAttribute("aria-expanded","false")}
  if(!t)return;
  if(t.id==="bellBtn"){const p=$("#pop");p.hidden=!p.hidden;t.setAttribute("aria-expanded",String(!p.hidden));if(!p.hidden){S.seenAlerts=renderAlerts.keys.slice();save();$("#bellCt").hidden=true}return}
  if(t.dataset.open){$("#pop").hidden=true;drawer(t.dataset.open);return}
  if(t.hasAttribute("data-close")){closeLayer();return}
  if(t.dataset.sort){const k=t.dataset.sort;if(UI.sort===k)UI.dir*=-1;else{UI.sort=k;UI.dir=k==="risk"?-1:1}render();return}
  if(t.dataset.act){const e=S.entities.find(x=>x.id===t.dataset.id);if(e)logAction(e,t.dataset.act,"");return}
  if(t.dataset.scope){UI.queueScope=t.dataset.scope;render();return}
  if(t.hasAttribute("data-add")){addForm();return}
  if(t.hasAttribute("data-reset")){
    if(t.dataset.armed){store.del(KEY);S={entities:buildSeed(),audit:[],seenAlerts:[]};closeLayer();render();toast("Demo data reset")}
    else{t.dataset.armed="1";t.textContent="Click again to confirm reset";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent="Reset demo data"}},3000)}
  }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"){closeLayer();$("#pop").hidden=true}
  if(ev.key==="Enter"&&ev.target.matches("tr[data-open]"))drawer(ev.target.dataset.open);
});
document.addEventListener("input",ev=>{
  const id=ev.target.id;
  if(id==="fq"){UI.q=ev.target.value;const pos=ev.target.selectionStart;render();const f=$("#fq");f.focus();f.setSelectionRange(pos,pos)}
});
document.addEventListener("change",ev=>{
  const m={fs:"status",fo:"obl",fse:"sector",fz:"zone"}[ev.target.id];
  if(m){UI[m]=ev.target.value;render()}
  if(ev.target.id==="officer"){store.set("core.officer",ev.target.value);if(openId)drawer(openId)}
});
const off=store.get("core.officer");if(off){const s=$("#officer");if([...s.options].some(o=>o.value===off))s.value=off}
try{if(window.self!==window.top)document.getElementById("homeLink").hidden=true}catch(e){document.getElementById("homeLink").hidden=true}
route();
})();
</script>

</body>
</html>
